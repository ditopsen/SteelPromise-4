<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Parkour - Steel Promise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
        }

        h1 {
            font-size: 13px;
            color: #ff0055;
            margin-bottom: 8px;
            text-shadow: 2px 2px #00ffff, 0 0 10px rgba(255, 0, 85, 0.5);
            letter-spacing: 2px;
        }

        #ui {
            font-size: 7px;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            background: #111122;
            padding: 8px 12px;
            border: 2px solid #333355;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        .hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333355;
            padding-right: 8px;
            margin-right: 2px;
        }

        .hud-box:last-child {
            border-right: none;
            padding-right: 0;
            margin-right: 0;
        }

        .hud-label {
            color: #8888aa;
            font-size: 5px;
            margin-bottom: 3px;
        }

        .hud-value {
            color: #00ffff;
        }

        .canvas-container {
            position: relative;
            border: 6px solid #222233;
            box-shadow: 0 0 0 4px #000, 0 0 25px rgba(255, 0, 85, 0.4);
        }

        canvas {
            display: block;
            background: #0b0b16;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 800px;
            height: 450px;
            cursor: crosshair;
        }

        #controls-hint {
            margin-top: 10px;
            font-size: 7px;
            color: #666688;
            text-align: center;
            line-height: 1.6;
        }

        span {
            color: #ffff00;
        }

        .heart-icon {
            color: #ff0055;
            text-shadow: 0 0 4px rgba(255, 0, 85, 0.6);
        }
    </style>
</head>
<body>

    <h1>STEEL PROMISE</h1>
    <div id="ui">
        <div class="hud-box">
            <span class="hud-label">MODE</span>
            <span id="modeDisplay" class="hud-value">NORMAL</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">LEVEL</span>
            <span><span id="levelDisplay" class="hud-value">1</span>/10</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">TIME</span>
            <span><span id="score" class="hud-value">0</span>s</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">KILLS/ZOMB</span>
            <span id="zombieCount" class="hud-value">0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">HP</span>
            <span id="hp" class="heart-icon">❤️ ❤️ ❤️</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">SHIELD [E]</span>
            <span id="shieldDisplay" class="hud-value">READY</span>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div id="controls-hint">
        [1] Easy (40 Lives) &nbsp;|&nbsp; [2] Normal (10 Lives) &nbsp;|&nbsp; [3] Hardcore (3 Lives) &nbsp;|&nbsp; [SPACE] Jump &nbsp;|&nbsp; [E] Shield
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let currentLevel = 1;
let score = 0;
let gameRunning = false;
let inTitleScreen = true;
let inMenu = false;
let inStory = false;
let storyStep = 0;
let gameFinished = false;
let difficulty = 'normal'; 
let frameCount = 0;
let cameraY = 0;

// Sistema de Escudo
let shieldActive = false;
let shieldHits = 0;
let shieldCooldownTimer = 0;

// Carga de la imagen de inicio
const titleImage = new Image();
titleImage.src = 'inicio/inicio.png';

// Carga de la imagen del jefe
const bossImage = new Image();
bossImage.src = 'jefe/jefe.png';

// Objeto del Jefe para el Nivel 1
let levelBoss = null;

// Carga de imágenes de la skin (personaje del juego)
const playerImages = {
    idle: new Image(),
    jump: new Image(),
    run: [],
    attack: []
};

playerImages.idle.src = 'personaje/idle.png';
playerImages.jump.src = 'personaje/jump.png';

for (let i = 1; i <= 6; i++) {
    let img = new Image();
    img.src = `personaje/run${i}.png`;
    playerImages.run.push(img);
}

for (let i = 1; i <= 4; i++) {
    let img = new Image();
    img.src = `personaje/attack${i}.png`;
    playerImages.attack.push(img);
}

// Carga de las 21 imágenes de la cinemática (carpeta ecena)
const storyFrames = [];
for (let i = 1; i <= 21; i++) {
    let img = new Image();
    img.src = `ecena/frame${i}.png`;
    storyFrames.push(img);
}

// Canvas auxiliar para Zombie
const zombieWidth = 38;
const zombieHeight = 54;
const zombieSprites = document.createElement('canvas');
const zCtx = zombieSprites.getContext('2d');
zCtx.imageSmoothingEnabled = false;
zombieSprites.width = zombieWidth * 2;
zombieSprites.height = zombieHeight;

function drawZombieSprite() {
    zCtx.clearRect(0, 0, zombieSprites.width, zombieSprites.height);
    const w = zombieWidth;
    function p(side, x, y, color) {
        zCtx.fillStyle = color;
        let scaleX = w / 14;
        let scaleY = zombieHeight / 19;
        zCtx.fillRect((side * w) + (x * scaleX), y * scaleY, scaleX, scaleY);
    }
    for (let side = 0; side < 2; side++) {
        p(side, 3, 1, '#152e1a'); p(side, 4, 1, '#1b3b22'); p(side, 5, 1, '#1b3b22'); p(side, 6, 1, '#152e1a');
        p(side, 2, 2, '#255430'); p(side, 3, 2, '#2e6b3d'); p(side, 4, 2, '#ff1111'); p(side, 5, 2, '#2e6b3d'); p(side, 6, 2, '#152e1a'); p(side, 7, 2, '#255430');
        p(side, 2, 3, '#255430'); p(side, 3, 3, '#152e1a'); p(side, 4, 3, '#2e6b3d'); p(side, 5, 3, '#ff1111'); p(side, 6, 3, '#2e6b3d'); p(side, 7, 3, '#152e1a');
        p(side, 2, 4, '#1b3b22'); p(side, 3, 4, '#1b3b22'); p(side, 4, 4, '#0d1f11'); p(side, 5, 4, '#1b3b22'); p(side, 6, 4, '#1b3b22');
        p(side, 3, 5, '#152e1a'); p(side, 4, 5, '#ffddaa'); p(side, 5, 5, '#152e1a');
        p(side, 4, 6, '#0d1f11'); p(side, 5, 6, '#0d1f11');
        p(side, 2, 7, '#3a1c1c'); p(side, 3, 7, '#5e2626'); p(side, 4, 7, '#ffffff'); p(side, 5, 7, '#5e2626'); p(side, 6, 7, '#3a1c1c');
        p(side, 1, 8, '#1b3b22'); p(side, 2, 8, '#5e2626'); p(side, 3, 8, '#255430'); p(side, 4, 8, '#255430'); p(side, 5, 8, '#255430'); p(side, 6, 8, '#5e2626'); p(side, 7, 8, '#1b3b22');
        p(side, 2, 9, '#3a1c1c'); p(side, 3, 9, '#0d1f11'); p(side, 4, 9, '#0d1f11'); p(side, 5, 9, '#3a1c1c');
        p(side, 3, 10, '#1b3b22'); p(side, 4, 10, '#1b3b22'); p(side, 5, 10, '#1b3b22');
        if (side === 0) {
            p(side, 0, 8, '#2e6b3d'); p(side, 1, 8, '#2e6b3d'); p(side, 0, 9, '#1b3b22');
        } else {
            p(side, 7, 8, '#2e6b3d'); p(side, 8, 8, '#2e6b3d'); p(side, 8, 9, '#1b3b22');
        }
        p(side, 1, 7, '#2e6b3d'); p(side, 7, 7, '#2e6b3d');
        p(side, 2, 11, '#111926'); p(side, 3, 11, '#111926'); p(side, 5, 11, '#111926'); p(side, 6, 11, '#111926');
        p(side, 2, 12, '#255430'); p(side, 3, 12, '#111926'); p(side, 5, 12, '#111926'); p(side, 6, 12, '#255430');
        p(side, 2, 13, '#111926'); p(side, 3, 13, '#1b3b22'); p(side, 5, 13, '#1b3b22'); p(side, 6, 13, '#111926');
        p(side, 2, 14, '#152e1a'); p(side, 3, 14, '#152e1a'); p(side, 5, 14, '#152e1a'); p(side, 6, 14, '#152e1a');
        p(side, 1, 15, '#050505'); p(side, 2, 15, '#050505'); p(side, 3, 15, '#050505');
        p(side, 5, 15, '#050505'); p(side, 6, 15, '#050505'); p(side, 7, 15, '#050505');
        p(side, 1, 16, '#050505'); p(side, 3, 16, '#050505'); p(side, 5, 16, '#050505'); p(side, 7, 16, '#050505');
    }
}
drawZombieSprite();

const stars = [];
for(let i = 0; i < 80; i++) {
    stars.push({
        x: Math.random() * 800,
        y: Math.random() * 2600 - 2000,
        size: Math.random() > 0.5 ? 2 : 1,
        alpha: 0.2 + Math.random() * 0.6
    });
}

const levelThemes = {
    1: { bg1: '#04040a', bg2: '#121226', ruinColor: '#0f0f1d', platColor: '#22223b', accent: '#00ffff' },
    2: { bg1: '#1a0505', bg2: '#2b1010', ruinColor: '#1d0f0f', platColor: '#3b2222', accent: '#ff3300' },
    3: { bg1: '#051a0b', bg2: '#102b15', ruinColor: '#0f1d11', platColor: '#223b28', accent: '#00ff66' },
    4: { bg1: '#15051a', bg2: '#24102b', ruinColor: '#1a0f1d', platColor: '#35223b', accent: '#cc00ff' },
    5: { bg1: '#1a1805', bg2: '#2b2710', ruinColor: '#1d1b0f', platColor: '#3b3722', accent: '#ffff00' },
    6: { bg1: '#05181a', bg2: '#10272b', ruinColor: '#0f1b1d', platColor: '#22353b', accent: '#00ccff' },
    7: { bg1: '#12051a', bg2: '#1f102b', ruinColor: '#140f1d', platColor: '#2b223b', accent: '#ff00aa' },
    8: { bg1: '#051a14', bg2: '#102b22', ruinColor: '#0f1d18', platColor: '#223b32', accent: '#00ffbb' },
    9: { bg1: '#1a0d05', bg2: '#2b1b10', ruinColor: '#1d120f', platColor: '#3b2a22', accent: '#ff8800' },
    10: { bg1: '#1a050b', bg2: '#2b101a', ruinColor: '#1d0f14', platColor: '#3b222c', accent: '#ff0055' }
};

let platforms = [];
let ruins = [
    { x: 40, y: 100, w: 70, h: 500 },
    { x: 170, y: -400, w: 90, h: 700 },
    { x: 310, y: -900, w: 100, h: 800 },
    { x: 470, y: -1300, w: 80, h: 700 },
    { x: 610, y: -800, w: 110, h: 750 },
    { x: 700, y: -1800, w: 80, h: 900 }
];

function setupLevel(lvl) {
    currentLevel = lvl;
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.jumpsLeft = 2;
    player.hp = (difficulty === 'hardcore') ? 3 : (difficulty === 'easy') ? 40 : 10;
    shieldActive = false;
    shieldHits = 0;
    shieldCooldownTimer = 0;
    cameraY = 0;
    projectiles = [];
    zombies = [];
    bombs = [];
    explosions = [];
    portal = null;
    score = 0;
    frameCount = 0;
    projectileTimer = 0;
    levelBoss = null;

    let offset = (lvl - 1) * 22;
    if (lvl === 5) {
        offset = 40;
    } else if (lvl >= 6) {
        offset = 40;
    }
    platforms = [
        { x: 0, y: 400, width: 800, height: 50, color: levelThemes[lvl].platColor },
        { x: 150, y: 300 - offset, width: 120, height: 20, color: levelThemes[lvl].platColor },
        { x: 500, y: 260 - offset, width: 130, height: 20, color: levelThemes[lvl].platColor },
        { x: 320, y: 190 - offset, width: 140, height: 20, color: levelThemes[lvl].platColor },
        { x: 100, y: 110 - offset, width: 120, height: 20, color: levelThemes[lvl].platColor },
        { x: 550, y: 70 - offset, width: 130, height: 20, color: levelThemes[lvl].platColor },
        { x: 260, y: 10 - offset, width: 150, height: 20, color: levelThemes[lvl].platColor },
        { x: 430, y: -50 - offset, width: 120, height: 20, color: levelThemes[lvl].platColor },
        { x: 130, y: -120 - offset, width: 140, height: 20, color: levelThemes[lvl].platColor },
        { x: 300, y: -190 - offset, width: 130, height: 20, color: levelThemes[lvl].platColor },
        { x: 580, y: -240 - offset, width: 120, height: 20, color: levelThemes[lvl].platColor },
        { x: 200, y: -310 - offset, width: 150, height: 20, color: levelThemes[lvl].platColor },
        { x: 450, y: -380 - offset, width: 130, height: 20, color: levelThemes[lvl].platColor },
        { x: 110, y: -450 - offset, width: 130, height: 20, color: levelThemes[lvl].platColor },
        { x: 340, y: -520 - offset, width: 140, height: 20, color: levelThemes[lvl].platColor },
        { x: 520, y: -590 - offset, width: 120, height: 20, color: levelThemes[lvl].platColor },
        { x: 230, y: -660 - offset, width: 150, height: 20, color: levelThemes[lvl].platColor }
    ];

    // Si es el nivel 1, agregamos el Jefe estático sobre la plataforma superior o principal
    if (lvl === 1) {
        levelBoss = {
            x: 600,
            y: 400 - 90, // Sobre el suelo o plataforma
            width: 70,
            height: 90
        };
    }

    for (let i = 1; i < platforms.length; i++) {
        let plat = platforms[i];
        let spawnX = plat.x + 10 + Math.random() * (plat.width - 20);
        let spawnY = plat.y - zombieHeight;
        let fromRight = Math.random() < 0.5;

        zombies.push({
            x: spawnX,
            y: spawnY,
            width: zombieWidth,
            height: zombieHeight,
            vx: (fromRight ? 1 : -1) * (1.2 + lvl * 0.12),
            shootCooldown: Math.floor(Math.random() * 30),
            hp: Math.floor(lvl / 3) + 1,
            facingRight: fromRight,
            platform: plat
        });
    }

    updateUI();
}

const keys = {};
window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3', 'KeyE'].includes(e.code)) e.preventDefault();
    
    if (inMenu) {
        if (e.code === 'Digit1' || e.code === 'Numpad1') {
            difficulty = 'easy';
            document.getElementById('modeDisplay').innerText = 'EASY';
        } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
            difficulty = 'normal';
            document.getElementById('modeDisplay').innerText = 'NORMAL';
        } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
            difficulty = 'hardcore';
            document.getElementById('modeDisplay').innerText = 'HARDCORE';
        }
    }

    if (e.code === 'KeyE' && gameRunning && shieldCooldownTimer <= 0 && !shieldActive) {
        shieldActive = true;
        shieldHits = 0;
        updateUI();
    }

    if ((e.code === 'Space' || e.code === 'ArrowUp') && !keys[e.code]) {
        if (inTitleScreen) {
            inTitleScreen = false;
            inMenu = true;
        } else if (inMenu) {
            inMenu = false;
            inStory = true;
            storyStep = 0;
        } else if (inStory) {
            storyStep++;
            if (storyStep >= storyFrames.length) {
                inStory = false;
                setupLevel(1);
                gameRunning = true;
            }
        } else if (gameFinished) {
            gameFinished = false;
            inTitleScreen = true;
        } else if (!gameRunning) {
            setupLevel(currentLevel);
            gameRunning = true;
        } else if (player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            player.jumpsLeft = 1;
        } else if (player.jumpsLeft > 0) {
            player.vy = player.jumpForce * 0.85;
            player.jumpsLeft--;
        }
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    if (inTitleScreen) {
        if (mouseX >= canvas.width / 2 - 100 && mouseX <= canvas.width / 2 + 100 &&
            mouseY >= canvas.height / 2 + 50 && mouseY <= canvas.height / 2 + 95) {
            inTitleScreen = false;
            inMenu = true;
        }
    } else if (inMenu) {
        if (mouseY >= canvas.height / 2 - 35 && mouseY <= canvas.height / 2 - 10) {
            difficulty = 'easy';
            document.getElementById('modeDisplay').innerText = 'EASY';
        } else if (mouseY >= canvas.height / 2 - 12 && mouseY <= canvas.height / 2 + 12) {
            difficulty = 'normal';
            document.getElementById('modeDisplay').innerText = 'NORMAL';
        } else if (mouseY >= canvas.height / 2 + 10 && mouseY <= canvas.height / 2 + 35) {
            difficulty = 'hardcore';
            document.getElementById('modeDisplay').innerText = 'HARDCORE';
        } else if (mouseX >= canvas.width / 2 - 110 && mouseX <= canvas.width / 2 + 110 &&
                   mouseY >= canvas.height / 2 + 55 && mouseY <= canvas.height / 2 + 95) {
            inMenu = false;
            inStory = true;
            storyStep = 0;
        }
    }
});

window.addEventListener('mousedown', (e) => {
    if (e.button === 0 && gameRunning && !player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 0;
        player.attackFrame = 0;
    }
});

let projectiles = [];
let zombies = [];
let bombs = [];
let explosions = [];
let portal = null;
let projectileTimer = 0;

function updateUI() {
    document.getElementById('levelDisplay').innerText = currentLevel;
    document.getElementById('score').innerText = score;
    document.getElementById('zombieCount').innerText = zombies.length;
    let hearts = '';
    for(let i=0; i<player.hp; i++) hearts += '❤️ ';
    document.getElementById('hp').innerText = hearts;

    let shieldSpan = document.getElementById('shieldDisplay');
    if (shieldActive) {
        shieldSpan.innerText = `ACTIVE (${5 - shieldHits}/5)`;
        shieldSpan.style.color = '#00ffff';
    } else if (shieldCooldownTimer > 0) {
        shieldSpan.innerText = `${Math.ceil(shieldCooldownTimer / 60)}s`;
        shieldSpan.style.color = '#ff3300';
    } else {
        shieldSpan.innerText = 'READY';
        shieldSpan.style.color = '#00ff66';
    }
}

const player = {
    x: 100,
    y: 300,
    width: 48,
    height: 60,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpForce: -10.5,
    gravity: 0.5,
    grounded: false,
    jumpsLeft: 2,
    facingRight: true,
    hp: 10,
    isAttacking: false,
    attackTimer: 0,
    attackFrame: 0,
    animTimer: 0,
    animFrame: 0
};

function update() {
    if (!gameRunning) return;
    frameCount++;
    
    if (shieldCooldownTimer > 0) {
        shieldCooldownTimer--;
        if (shieldCooldownTimer % 60 === 0) updateUI();
    }

    if (frameCount % 60 === 0) {
        score++;
        updateUI();

        if ((zombies.length === 0 || score >= 120) && !portal) {
            portal = { x: 380, y: platforms[platforms.length - 1].y - 65, width: 40, height: 50, active: true };
        }
    }

    if (player.isAttacking) {
        player.attackTimer++;
        if (player.attackTimer % 5 === 0) {
            player.attackFrame++;
            if (player.attackFrame >= playerImages.attack.length) {
                player.isAttacking = false;
                player.attackFrame = 0;
            }
        }
    }

    player.vx = 0;
    let isMoving = false;
    if (keys['KeyA'] || keys['ArrowLeft']) {
        player.vx = -player.speed;
        player.facingRight = false;
        isMoving = true;
    }
    if (keys['KeyD'] || keys['ArrowRight']) {
        player.vx = player.speed;
        player.facingRight = true;
        isMoving = true;
    }
    player.x += player.vx;

    if (isMoving && player.grounded) {
        player.animTimer++;
        if (player.animTimer > 5) {
            player.animFrame = (player.animFrame + 1) % playerImages.run.length;
            player.animTimer = 0;
        }
    } else {
        player.animFrame = 0;
    }

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    player.vy += player.gravity;
    player.y += player.vy;

    const absoluteBottom = platforms[0].y + 100;
    if (player.y > absoluteBottom) {
        takeDamage();
        player.y = 300;
        player.vy = 0;
    }

    player.grounded = false;
    for (let p of platforms) {
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y + player.height >= p.y &&
            player.y + player.height - player.vy <= p.y + 6
        ) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
            player.jumpsLeft = 2;
        }
    }

    let targetCameraY = player.y - 200;
    cameraY += (targetCameraY - cameraY) * 0.1;

    if (portal && portal.active) {
        if (
            player.x < portal.x + portal.width &&
            player.x + player.width > portal.x &&
            player.y < portal.y + portal.height &&
            player.y + portal.height > portal.y
        ) {
            if (currentLevel < 10) {
                currentLevel++;
                setupLevel(currentLevel);
            } else {
                gameRunning = false;
                gameFinished = true;
            }
        }
    }

    let projFreq = Math.max(15, 40 - currentLevel * 2);
    projectileTimer++;
    if (projectileTimer >= projFreq) {
        let fromRight = Math.random() < 0.5;
        projectiles.push({
            x: fromRight ? canvas.width + 20 : -20,
            y: player.y + (Math.random() * 200 - 100),
            width: 18,
            height: 10,
            vx: (fromRight ? -1 : 1) * (3.5 + currentLevel * 0.3),
            color: levelThemes[currentLevel].accent
        });
        projectileTimer = 0;
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        if (p.x < -100 || p.x > canvas.width + 100) {
            projectiles.splice(i, 1);
            continue;
        }
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + p.height > p.y
        ) {
            projectiles.splice(i, 1);
            if (shieldActive) {
                shieldHits++;
                updateUI();
                if (shieldHits >= 5) {
                    shieldActive = false;
                    shieldCooldownTimer = 600; 
                    updateUI();
                }
            } else {
                takeDamage();
            }
        }
    }

    for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        z.x += z.vx;

        if (z.platform) {
            let leftBound = z.platform.x + 4;
            let rightBound = z.platform.x + z.platform.width - z.width - 4;
            if (z.x <= leftBound) {
                z.x = leftBound;
                z.vx *= -1;
                z.facingRight = true;
            } else if (z.x >= rightBound) {
                z.x = rightBound;
                z.vx *= -1;
                z.facingRight = false;
            }
        }

        z.shootCooldown++;
        let bombRate = Math.max(35, 90 - currentLevel * 5);
        if (z.shootCooldown > bombRate) {
            z.shootCooldown = 0;
            bombs.push({
                x: z.x,
                y: z.y - 10,
                vx: (player.x > z.x ? 1 : -1) * (2.2 + currentLevel * 0.15),
                vy: -5.0,
                gravity: 0.35,
                width: 12,
                height: 12
            });
        }

        if (player.isAttacking) {
            let swordBox = {
                x: player.facingRight ? player.x + player.width : player.x - 35,
                y: player.y + 10,
                width: 35,
                height: 35
            };
            if (
                swordBox.x < z.x + z.width &&
                swordBox.x + swordBox.width > z.x &&
                swordBox.y < z.y + z.height &&
                swordBox.y + swordBox.height > z.y
            ) {
                z.hp--;
                if (z.hp <= 0) {
                    explosions.push({ x: z.x + z.width/2, y: z.y + z.height/2, radius: 6, maxRadius: 35, alpha: 1.0 });
                    zombies.splice(i, 1);
                    score += 5;
                    updateUI();
                    if ((zombies.length === 0 || score >= 120) && !portal) {
                        portal = { x: 380, y: platforms[platforms.length - 1].y - 65, width: 40, height: 50, active: true };
                    }
                    continue;
                }
            }
        }
    }

    for (let i = bombs.length - 1; i >= 0; i--) {
        let b = bombs[i];
        b.x += b.vx;
        b.vy += b.gravity;
        b.y += b.vy;

        for (let plat of platforms) {
            if (
                b.x < plat.x + plat.width &&
                b.x + b.width > plat.x &&
                b.y + b.height >= plat.y &&
                b.y + b.height - b.vy <= plat.y + 8
            ) {
                explosions.push({ x: b.x + b.width/2, y: plat.y, radius: 6, maxRadius: 28, alpha: 1.0 });
                bombs.splice(i, 1);
                break;
            }
        }

        if (bombs[i] && (
            player.x < b.x + b.width &&
            player.x + player.width > b.x &&
            player.y < b.y + b.height &&
            player.y + b.height > b.y
        )) {
            explosions.push({ x: b.x + b.width/2, y: b.y + b.height/2, radius: 6, maxRadius: 28, alpha: 1.0 });
            bombs.splice(i, 1);
            if (shieldActive) {
                shieldHits++;
                updateUI();
                if (shieldHits >= 5) {
                    shieldActive = false;
                    shieldCooldownTimer = 600; 
                    updateUI();
                }
            } else {
                takeDamage();
            }
        }
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
        let ex = explosions[i];
        ex.radius += 1.2;
        ex.alpha -= 0.04;
        if (ex.alpha <= 0) explosions.splice(i, 1);
    }
}

function takeDamage() {
    player.hp--;
    updateUI();
    if (player.hp <= 0) {
        gameRunning = false;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const theme = levelThemes[currentLevel];
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, theme.bg1);
    grad.addColorStop(0.6, theme.bg2);
    grad.addColorStop(1, '#05050a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    for(let s of stars) {
        ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha})`;
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
    }

    for (let r of ruins) {
        ctx.fillStyle = theme.ruinColor;
        ctx.fillRect(r.x, r.y, r.w, r.h);
    }

    for (let p of platforms) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.width, p.height);
        ctx.fillStyle = theme.accent;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.width, 3);
    }

    // Dibujar el Jefe en el Nivel 1 (Estático, sin ataques)
    if (currentLevel === 1 && levelBoss) {
        if (bossImage.complete && bossImage.naturalWidth !== 0) {
            ctx.drawImage(bossImage, Math.floor(levelBoss.x), Math.floor(levelBoss.y), levelBoss.width, levelBoss.height);
        } else {
            // Placeholder si la imagen aún carga
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(Math.floor(levelBoss.x), Math.floor(levelBoss.y), levelBoss.width, levelBoss.height);
        }
    }

    if (portal && portal.active) {
        ctx.fillStyle = theme.accent;
        ctx.fillRect(Math.floor(portal.x), Math.floor(portal.y), portal.width, portal.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(portal.x + 8), Math.floor(portal.y + 8), portal.width - 16, portal.height - 16);
    }

    for (let z of zombies) {
        const subW = zombieWidth;
        const sx = z.facingRight ? subW : 0;
        ctx.drawImage(zombieSprites, sx, 0, subW, zombieHeight, Math.floor(z.x), Math.floor(z.y), subW, zombieHeight);
    }

    for (let b of bombs) {
        ctx.fillStyle = '#ff3300';
        ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.width, b.height);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(Math.floor(b.x + 3), Math.floor(b.y + 3), 4, 4);
    }

    for (let ex of explosions) {
        ctx.fillStyle = `rgba(255, 120, 0, ${ex.alpha})`;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let p of projectiles) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.width, p.height);
        ctx.shadowBlur = 0;
    }

    let currentImg = playerImages.idle;
    if (player.isAttacking) {
        let atkIdx = Math.min(player.attackFrame, playerImages.attack.length - 1);
        currentImg = playerImages.attack[atkIdx] || playerImages.idle;
    } else if (!player.grounded) {
        currentImg = playerImages.jump;
    } else if (player.vx !== 0) {
        let runIdx = player.animFrame % playerImages.run.length;
        currentImg = playerImages.run[runIdx] || playerImages.idle;
    } else {
        currentImg = playerImages.idle;
    }

    ctx.save();
    if (!player.facingRight) {
        ctx.translate(Math.floor(player.x) + player.width / 2, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(currentImg, -player.width / 2, Math.floor(player.y), player.width, player.height);
    } else {
        ctx.drawImage(currentImg, Math.floor(player.x), Math.floor(player.y), player.width, player.height);
    }
    ctx.restore();

    if (shieldActive) {
        ctx.save();
        ctx.strokeStyle = '#00ffff';
        ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(Math.floor(player.x + player.width / 2), Math.floor(player.y + player.height / 2), Math.max(player.width, player.height) * 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    ctx.restore();

    if (inTitleScreen) {
        if (titleImage.complete && titleImage.naturalWidth !== 0) {
            ctx.drawImage(titleImage, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(canvas.width / 2 - 100, canvas.height / 2 + 50, 200, 45);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.width / 2 - 100, canvas.height / 2 + 50, 200, 45);

        ctx.fillStyle = '#ffff00';
        ctx.font = '8px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('INICIAR JUEGO', canvas.width / 2, canvas.height / 2 + 78);
        ctx.textAlign = 'left';

    } else if (inMenu) {
        ctx.fillStyle = 'rgba(5, 5, 10, 0.92)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ffff';
        ctx.font = '13px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('SELECCIONA DIFICULTAD', canvas.width / 2, canvas.height / 2 - 65);

        ctx.fillStyle = difficulty === 'easy' ? '#00ff66' : '#666688';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText('[1] EASY MODE (40 Lives)', canvas.width / 2, canvas.height / 2 - 22);

        ctx.fillStyle = difficulty === 'normal' ? '#00ffff' : '#666688';
        ctx.fillText('[2] NORMAL MODE (10 Lives)', canvas.width / 2, canvas.height / 2 + 2);

        ctx.fillStyle = difficulty === 'hardcore' ? '#ff0055' : '#666688';
        ctx.fillText('[3] HARDCORE MODE (3 Lives)', canvas.width / 2, canvas.height / 2 + 25);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(canvas.width / 2 - 110, canvas.height / 2 + 55, 220, 40);
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.width / 2 - 110, canvas.height / 2 + 55, 220, 40);

        ctx.fillStyle = '#ffff00';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText('CONTINUAR (ESPACIO)', canvas.width / 2, canvas.height / 2 + 79);
        ctx.textAlign = 'left';

    } else if (inStory) {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let currentStoryImg = storyFrames[storyStep];
        if (currentStoryImg && currentStoryImg.complete && currentStoryImg.naturalWidth !== 0) {
            ctx.drawImage(currentStoryImg, 0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(canvas.width / 2 - 120, canvas.height - 45, 240, 25);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(canvas.width / 2 - 120, canvas.height - 45, 240, 25);

        ctx.fillStyle = '#ffff00';
        ctx.font = '7px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE TO CONTINUE', canvas.width / 2, canvas.height - 30);
        ctx.textAlign = 'left';
    } else if (gameFinished) {
        ctx.fillStyle = 'rgba(5, 5, 10, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ffff';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('CONTINUARA...', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ff0055';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText('GRACIAS POR JUGAR', canvas.width / 2, canvas.height / 2 + 15);

        ctx.fillStyle = '#ffff00';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
    } else if (!gameRunning) {
        ctx.fillStyle = 'rgba(5, 5, 10, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0055';
        ctx.font = '13px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#00ffff';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText('PRESS SPACE TO RETRY', canvas.width / 2, canvas.height / 2 + 15);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
